name: Daily Vercel Rebuild

on:
  schedule:
    # Runs at 04:00 UTC every day
    - cron: '0 4 * * *'
  # Allows you to trigger the build manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  rebuild:
    name: Trigger Vercel Deploy Hook
    runs-on: ubuntu-latest
    steps:
      - name: Send POST Request to Vercel
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        # -f makes the job fail (instead of silently passing) when the hook returns an error
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
